name: conciliador

services:
  app:
    build:
      context: .
    image: conciliador-app:latest
    container_name: conciliador
    hostname: conciliador
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - conciliador_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  conciliador_uploads:
    name: conciliador_uploads
